<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EE">
<title>iFeel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* VOICE: calm, quiet, unhurried.
     IDEA: a muted retro feelings wheel you can turn by hand, like a paper volvelle.
     PICTURE: the wheel itself, with a lens that swells whatever reaches the pointer.
     COLOUR and TYPE: navy, sage, mustard, dusty blue, brick, burnt orange on near-white; Manrope.
     LAYOUT: one column, wheel first, readout and two buttons under it, sheets slide up. */
  :root {
    --ink: #26324A;
    --ink-soft: #55607A;
    --bg-a: #FCFCFB;
    --bg-b: #F3F1EE;
    --accent: #2F3F5E;
    --line: #DCDFE6;
    --panel: rgba(255,255,255,0.78);
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 90% at 50% 40%, var(--bg-a) 0%, var(--bg-b) 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow-x: clip;
  }
  ::selection { background: #E9D6AE; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 20px 6px;
    max-width: 720px; margin: 0 auto;
  }
  .brand { font-weight: 700; font-size: 24px; letter-spacing: -0.02em; }
  .brand span { color: #8C6A1F; }

  main { max-width: 720px; margin: 0 auto; padding: 0 16px 24px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 6px 0 10px; text-align: center; color: var(--ink-soft); min-height: 1.3em; }

  .wheelwrap { position: relative; width: min(94vw, calc(100dvh - 410px), 620px); min-width: 280px; aspect-ratio: 1; }
  #wheel { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  #wheel:active { cursor: grabbing; }
  #wheel:focus { outline: none; }
  #wheel:focus-visible .hub { stroke: var(--accent); stroke-width: 6; }
  .pointer {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
    width: 0; height: 0; z-index: 2; pointer-events: none;
    border-left: 13px solid transparent; border-right: 13px solid transparent;
    border-top: 22px solid var(--ink);
    filter: drop-shadow(0 2px 2px rgba(38,50,74,.25));
  }
  .seg path { stroke: rgba(255,255,255,.8); stroke-width: 2; }
  .seg text { font-family: "Manrope", system-ui, sans-serif; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .seg.on path { stroke: #fff; stroke-width: 5; }
  .seg.on text { font-weight: 700; }
  .seg.onp path { stroke: #fff; stroke-width: 3.5; }
  .hub { fill: #fff; stroke: #E6E3DE; stroke-width: 3; }
  #centerG { cursor: pointer; }
  #centerG text { text-anchor: middle; dominant-baseline: central; font-family: "Manrope", system-ui, sans-serif; pointer-events: none; fill: var(--ink); }

  .readout { display: flex; align-items: center; gap: 14px; min-height: 76px; margin-top: 10px; }
  .readout .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px rgba(255,255,255,.9); transition: background .3s; }
  .readout .path { font-size: 16px; color: var(--ink-soft); font-weight: 500; }
  .readout .word { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .readout.landed .word { animation: settle .6s ease; }
  @keyframes settle { 0% { transform: scale(.94); opacity: .5 } 100% { transform: none; opacity: 1 } }

  .about { max-width: 470px; text-align: center; min-height: 96px; margin: 0 0 6px; padding: 0 8px; }
  .def { font-size: 18px; line-height: 1.45; margin: 0 0 6px; }
  .rel { font-size: 15px; line-height: 1.55; color: var(--ink-soft); margin: 0; }
  .rel b { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .rel i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .actions { display: flex; gap: 12px; margin-top: 6px; }
  .btn { border: 0; border-radius: 999px; padding: 14px 26px; font-size: 18px; font-weight: 600; min-height: 48px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .hint { font-size: 15px; color: var(--ink-soft); margin: 14px 0 0; text-align: center; min-height: 44px; }
  .linkish { background: none; border: 0; text-decoration: underline; color: var(--ink); font-size: 16px; padding: 10px; }

  #scrim { position: fixed; inset: 0; background: rgba(38,50,74,.28); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 620px; margin: 0 auto; max-height: 88dvh; overflow: auto;
    background: #FCFCFB; border-radius: 26px 26px 0 0;
    padding: 22px 22px max(22px, env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -8px 30px rgba(38,50,74,.15);
  }
  .sheet.show { transform: none; }
  .sheet h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .sheet h2 .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .sheet .sub { color: var(--ink-soft); font-size: 16px; margin: 0 0 14px; line-height: 1.5; }
  .sheet h3 { font-size: 17px; font-weight: 600; margin: 18px 0 10px; }
  .muted { font-weight: 400; color: var(--ink-soft); }
  .levels { display: flex; gap: 8px; }
  .levels button { flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 0; font-size: 18px; font-weight: 600; }
  .levels button[aria-pressed="true"] { border-color: var(--accent); background: #E8ECF3; }
  .levels-legend { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
  textarea, input[type=text] { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 12px; font: inherit; font-size: 17px; color: var(--ink); background: #fff; }
  textarea { min-height: 84px; resize: vertical; }
  .sheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

  .bodycheck { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 16px; align-items: center; }
  .bodycheck svg { width: 120px; height: auto; }
  .bodycheck svg [data-zone] { fill: #E4E7EE; stroke: #fff; stroke-width: 2; cursor: pointer; transition: fill .2s; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 9px 14px; font-size: 16px; font-weight: 600; min-height: 44px; }
  .chips button[aria-pressed="true"] { border-color: var(--accent); background: #E8ECF3; }

  .options { display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; }
  .opt { text-align: left; border: 0; border-top: 3px solid var(--accent); background: #F0F2F6; border-radius: 4px 4px 14px 14px; padding: 14px 16px; }
  .opt strong { display: block; font-size: 18px; }
  .opt span { font-size: 16px; color: var(--ink-soft); }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0; }
  .stage svg { width: 170px; height: 170px; }
  .stage .big { font-size: 22px; font-weight: 700; text-align: center; }
  .msg { background: #F0F2F6; border-radius: 14px; padding: 14px 16px; font-size: 18px; width: 100%; }

  .strip { display: grid; grid-template-columns: repeat(14, minmax(0,1fr)); gap: 4px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 64px; }
  .day .lbl { font-size: 13px; color: var(--ink-soft); }
  .day .d { width: 12px; height: 12px; border-radius: 50%; }
  .entries { list-style: none; padding: 0; margin: 0; }
  .entries li { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid #ECEEF2; }
  .entries .d { width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; }
  .entries .w { font-weight: 700; font-size: 18px; }
  .entries .p { font-size: 14px; color: var(--ink-soft); }
  .entries .n { font-size: 16px; margin-top: 4px; }
  .entries .t { font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
  .empty { color: var(--ink-soft); font-size: 16px; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 16px; transition: all .3s; z-index: 20; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 420px) { .bodycheck { grid-template-columns: 92px minmax(0,1fr); } .bodycheck svg { width: 92px; } }
  @media (prefers-reduced-motion: reduce) { .sheet, #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="brand">i<span>Feel</span></div>
  <button id="journalBtn" class="btn ghost" style="padding:10px 18px;font-size:16px">Journal</button>
</header>

<main>
  <h1 id="prompt">How are you, right now?</h1>
  <div class="wheelwrap">
    <div class="pointer" aria-hidden="true"></div>
    <svg id="wheel" viewBox="-500 -500 1000 1000" role="application" aria-label="Emotion wheel. Use left and right arrows to turn, Enter to open or choose, Escape to go back." tabindex="0">
      <g id="zoom"><g id="segs"></g></g>
      <g id="centerG">
        <circle class="hub" r="92"></circle>
        <text id="hubMain" y="-6" font-size="28" font-weight="700"></text>
        <text id="hubSub" y="30" font-size="18" font-weight="500"></text>
      </g>
    </svg>
  </div>

  <div class="readout" id="readout" aria-live="polite">
    <span class="dot" id="roDot"></span>
    <div><div class="path" id="roPath"></div><div class="word" id="roWord"></div></div>
  </div>
  <div class="about" aria-live="polite"><p class="def" id="def"></p><p class="rel" id="rel"></p></div>
  <div class="actions">
    <button class="btn ghost" id="spinBtn">Spin</button>
    <button class="btn primary" id="logBtn">That's it</button>
  </div>
  <div class="hint" id="hint"></div>
</main>

<div id="scrim"></div>

<section class="sheet" id="logSheet" role="dialog" aria-modal="true" aria-labelledby="logTitle">
  <h2 id="logTitle"><span class="dot" id="logDot"></span><span id="logWord"></span></h2>
  <p class="sub" id="logPath"></p>
  <h3>How strong is it?</h3>
  <div class="levels" id="levels"></div>
  <div class="levels-legend"><span>a little</span><span>a lot</span></div>
  <h3>Where do you feel it? <span class="muted">(optional)</span></h3>
  <div class="bodycheck">
    <svg viewBox="0 0 140 262" aria-hidden="true" id="bodySvg">
      <ellipse data-zone="Head" cx="70" cy="27" rx="18" ry="21"/>
      <rect data-zone="Jaw and throat" x="61" y="49" width="18" height="14" rx="6"/>
      <rect data-zone="Shoulders" x="32" y="63" width="76" height="16" rx="8"/>
      <rect data-zone="Chest" x="44" y="80" width="52" height="40" rx="10"/>
      <rect data-zone="Stomach" x="46" y="121" width="48" height="42" rx="12"/>
      <rect data-zone="Arms and hands" x="16" y="80" width="15" height="88" rx="7"/>
      <rect data-zone="Arms and hands" x="109" y="80" width="15" height="88" rx="7"/>
      <rect data-zone="Legs" x="47" y="165" width="21" height="92" rx="10"/>
      <rect data-zone="Legs" x="72" y="165" width="21" height="92" rx="10"/>
    </svg>
    <div class="chips" id="zones"></div>
  </div>
  <h3>What's behind it? <span class="muted">(optional)</span></h3>
  <textarea id="note" placeholder="A few words are enough"></textarea>
  <div class="row">
    <button class="btn ghost" id="cancelLog">Not now</button>
    <button class="btn primary" id="saveLog">Save</button>
  </div>
</section>

<section class="sheet" id="afterSheet" role="dialog" aria-modal="true" aria-labelledby="afterTitle">
  <h2 id="afterTitle"></h2>
  <p class="sub" id="afterSub"></p>
  <div id="afterBody"></div>
  <div class="row"><button class="btn ghost" id="afterDone">Done</button></div>
</section>

<section class="sheet" id="journalSheet" role="dialog" aria-modal="true" aria-labelledby="jTitle">
  <h2 id="jTitle">Journal</h2>
  <p class="sub">The last two weeks, one dot per check-in.</p>
  <div class="strip" id="strip"></div>
  <h3>Check-ins</h3>
  <ul class="entries" id="entries"></ul>
  <div class="row"><button class="btn ghost" id="closeJournal">Close</button></div>
</section>

<div id="toast" role="status"></div>

<script>
{
  // ---------- Feelings: core → secondary → specific, clockwise from the top ----------
  // The first three families (pleasant) take half the wheel; the rest share the other half.
  const FAMILIES = [
    { name: 'Joyful', color: '#D9AE55', tone: 'pleasant', secs: {
      Playful: ['Cheeky','Amused','Aroused'], Cheerful: ['Delighted','Jovial','Pleased'], Elated: ['Ecstatic','Triumphant'],
      Interested: ['Curious','Inquisitive','Fascinated'], Optimistic: ['Hopeful','Inspired','Encouraged'], Enthusiastic: ['Passionate','Motivated','Energized'] } },
    { name: 'Powerful', color: '#5F8577', tone: 'pleasant', secs: {
      Proud: ['Successful','Confident','Satisfied'], Accepted: ['Respected','Valued','Appreciated'], Courageous: ['Daring','Self-assured'],
      Creative: ['Imaginative','Stimulated'], Resilient: ['Strong','Faithful'], Important: ['Worthwhile','Valuable'], Aware: ['Awakened','Authentic'] } },
    { name: 'Peaceful', color: '#34476B', tone: 'pleasant', secs: {
      Content: ['Free','Relieved'], Calm: ['Relaxed','Serene','Chilled'], Trusting: ['Safe','Receptive','Sensitive'],
      Loving: ['Intimate','Nurturing','Generous'], Thankful: ['Grateful','Appreciative','Blessed'], Thoughtful: ['Pensive','Admiring'] } },
    { name: 'Sad', color: '#5A8BAC', secs: {
      Lonely: ['Isolated','Abandoned','Neglected'], Vulnerable: ['Victimized','Fragile'], Despair: ['Grief','Powerless','Hopeless'],
      Guilty: ['Ashamed','Remorseful','Mortified'], Depressed: ['Empty','Inferior','Miserable'], Hurt: ['Disappointed','Embarrassed','Injured'], Somber: ['Sorrowful','Discouraged'] } },
    { name: 'Disgusted', color: '#8C8547', secs: {
      Disapproving: ['Judgmental','Embarrassed'], Disappointed: ['Appalled','Revolted'], Awful: ['Nauseated','Detestable','Queasy'],
      Repelled: ['Horrified','Hesitant'], Aversion: ['Distaste','Loathing'] } },
    { name: 'Angry', color: '#B5463E', secs: {
      'Let down': ['Betrayed','Resentful','Wronged'], Humiliated: ['Disrespected','Ridiculed','Insulted'], Bitter: ['Indignant','Violated','Envious'],
      Mad: ['Furious','Jealous','Enraged'], Aggressive: ['Provoked','Hostile','Confrontational'], Frustrated: ['Infuriated','Annoyed','Thwarted'],
      Irritated: ['Agitated','Impatient'], Distant: ['Withdrawn','Numb'], Critical: ['Skeptical','Dismissive','Sarcastic'] } },
    { name: 'Fearful', color: '#C9773D', secs: {
      Scared: ['Helpless','Frightened','Terrified'], Anxious: ['Overwhelmed','Worried','Uneasy'], Insecure: ['Inadequate','Inferior','Unsure'],
      Weak: ['Worthless','Insignificant'], Rejected: ['Excluded','Persecuted','Unwanted'], Threatened: ['Nervous','Exposed','Apprehensive'] } },
    { name: 'Bad', color: '#6E6787', secs: {
      Bored: ['Indifferent','Apathetic'], Busy: ['Pressured','Rushed','Hurried'], Stressed: ['Overwhelmed','Out of control'], Tired: ['Sleepy','Unfocused','Exhausted'] } },
    { name: 'Surprised', color: '#A86B78', tone: 'mixed', pleasantSecs: ['Amazed','Moved','Excited'], secs: {
      Startled: ['Shocked','Dismayed'], Confused: ['Disillusioned','Perplexed','Distracted'], Amazed: ['Astonished','Awe','Speechless'],
      Moved: ['Touched','Overcome'], Excited: ['Eager','Energetic'] } }
  ];

  // ---------- What each feeling means, and how it relates to the others ----------
  // d: definition. m: a blend, after Plutchik's wheel where he names one. n: a note. o: its opposite.
  const ABOUT = {
    Joyful: { d: 'Lightness and pleasure in what is happening.', o: 'Sad' },
    Powerful: { d: 'Feeling capable, worthy and able to act.', o: 'Weak' },
    Peaceful: { d: 'Settled and at ease, with nothing pulling at you.', o: 'Stressed' },
    Sad: { d: 'A heavy feeling of loss, or of missing something.', o: 'Joyful' },
    Disgusted: { d: 'Wanting to pull away from something that feels wrong or offensive.', o: 'Trusting' },
    Angry: { d: 'Heat and push against something that feels unfair or in the way.', o: 'Fearful' },
    Fearful: { d: 'Alarm that something bad could happen to you.', o: 'Angry', n: 'Fear pulls you back; anger pushes you forward, which is why they sit opposite each other.' },
    Bad: { d: 'Low or worn down, without one sharp feeling.', n: 'Often a mix of tiredness and stress rather than a single emotion.' },
    Surprised: { d: 'Caught by the unexpected, for better or worse.', o: 'Interested', n: 'It quickly turns into something else: delight, fear, disappointment.' },

    Playful: { d: 'In the mood to joke, tease and have fun.' },
    Cheeky: { d: 'Playfully bold, a little irreverent.' },
    Amused: { d: 'Finding something funny.' },
    Aroused: { d: 'Physically or sexually stirred.' },
    Cheerful: { d: 'Bright and good-humoured.' },
    Delighted: { d: 'Very pleased, often by something you did not expect.', m: ['Joyful', 'Surprised'] },
    Jovial: { d: 'Warm, sociable good humour.' },
    Pleased: { d: 'Quietly satisfied with how something went.' },
    Elated: { d: 'Lifted up, high on good news.' },
    Ecstatic: { d: 'Overwhelming joy.', n: 'The strongest form of joy; serene is the mildest.' },
    Triumphant: { d: 'The joy of having won or overcome something.', m: ['Joyful', 'Powerful'] },
    Interested: { d: 'Attention drawn toward something, wanting more of it.', n: 'Plutchik calls this anticipation; it sits opposite surprise.' },
    Curious: { d: 'Wanting to know or explore.', m: ['Trusting', 'Surprised'] },
    Inquisitive: { d: 'Asking questions, actively digging in.' },
    Fascinated: { d: 'Absorbed, hard to look away.' },
    Optimistic: { d: 'Expecting things to turn out well.', m: ['Joyful', 'Interested'] },
    Hopeful: { d: 'Wishing for something good and believing it could come.', m: ['Interested', 'Trusting'], o: 'Hopeless' },
    Inspired: { d: 'Moved to make or do something by what you saw or felt.' },
    Encouraged: { d: 'Given more heart to keep going.', o: 'Discouraged' },
    Enthusiastic: { d: 'Eager, energetic interest in something.' },
    Passionate: { d: 'Strong, driving feeling for something or someone.' },
    Motivated: { d: 'Wanting to act, and having the push to do it.' },
    Energized: { d: 'Full of energy you can use.' },

    Proud: { d: 'Pleased with something you did or are.', m: ['Joyful', 'Angry'], n: 'In Plutchik’s model, pride is joy with a little of anger’s push.' },
    Successful: { d: 'Having reached what you aimed for.' },
    Confident: { d: 'Trusting your own ability.', o: 'Insecure' },
    Satisfied: { d: 'Needs met; nothing more needed for now.' },
    Accepted: { d: 'Welcomed as you are.', o: 'Rejected' },
    Respected: { d: 'Treated as someone whose view counts.', o: 'Disrespected' },
    Valued: { d: 'Seen as worth something to others.' },
    Appreciated: { d: 'Recognised and thanked for what you give.' },
    Courageous: { d: 'Acting even though you are afraid.', m: ['Fearful', 'Powerful'], n: 'Courage is not the absence of fear; it is fear plus strength.' },
    Daring: { d: 'Willing to take a bold risk.' },
    'Self-assured': { d: 'Calmly sure of yourself.' },
    Creative: { d: 'Making or imagining something new.' },
    Imaginative: { d: 'A mind full of new pictures and possibilities.' },
    Stimulated: { d: 'Mentally switched on and engaged.' },
    Resilient: { d: 'Able to bend and recover.' },
    Strong: { d: 'Sturdy enough to carry what comes.', o: 'Weak' },
    Faithful: { d: 'Steady in loyalty or belief.' },
    Important: { d: 'Feeling that you matter.', o: 'Insignificant' },
    Worthwhile: { d: 'Feeling your time or effort is worth it.' },
    Valuable: { d: 'Feeling you have something real to offer.', o: 'Worthless' },
    Aware: { d: 'Clear and present, noticing what is going on.' },
    Awakened: { d: 'Seeing something freshly, as if for the first time.' },
    Authentic: { d: 'Being true to yourself rather than performing.' },

    Content: { d: 'Happy enough with things as they are.' },
    Free: { d: 'Unconstrained; nothing holding you back.' },
    Relieved: { d: 'A weight lifted after worry or strain.', n: 'What fear or stress often turns into once it passes.' },
    Calm: { d: 'Quiet and steady inside.', o: 'Agitated' },
    Relaxed: { d: 'Body and mind loosened, without tension.' },
    Serene: { d: 'Deep, clear calm.', n: 'Plutchik’s mildest form of joy.' },
    Chilled: { d: 'Easy-going and unbothered.' },
    Trusting: { d: 'Able to rely on someone or something.', o: 'Disgusted', n: 'Trust and disgust are opposites: one moves toward, the other away.' },
    Safe: { d: 'Protected, with no threat nearby.', o: 'Threatened' },
    Receptive: { d: 'Open to what others offer or say.' },
    Sensitive: { d: 'Tuned in, easily touched by others.' },
    Loving: { d: 'Warmth and care for someone.', m: ['Joyful', 'Trusting'] },
    Intimate: { d: 'Close and open with someone.' },
    Nurturing: { d: 'Wanting to care for something and help it grow.' },
    Generous: { d: 'Wanting to give freely.' },
    Thankful: { d: 'Aware of something good you received.' },
    Grateful: { d: 'Warm appreciation for what you have or were given.' },
    Appreciative: { d: 'Noticing and valuing the good in something.' },
    Blessed: { d: 'Lucky beyond what you feel you earned.' },
    Thoughtful: { d: 'Reflective, turning things over carefully.' },

  const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

    stop();
    const c = centre();
    drag = { c, last: angleOf(e, c), t: performance.now(), t0: performance.now(), x: e.clientX, y: e.clientY, moved: 0, vel: 0, target: e.target };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
    const r = Math.hypot(e.clientX - drag.c[0], e.clientY - drag.c[1]);
    const a = angleOf(e, drag.c);
    if (r < drag.c[2] * 0.06) { drag.last = a; return; }
    const now = performance.now(), dt = Math.max(1, now - drag.t);
    const d = norm(a - drag.last);
    if (drag.moved > 6) { rot += d; spinning = true; draw(); }
    drag.vel = 0.6 * (d / dt) + 0.4 * drag.vel;
    drag.last = a; drag.t = now;
  });
  const end = () => {
    if (!drag) return;
    const now = performance.now(), d = drag; drag = null;
    if (d.moved < 8 && now - d.t0 < 450) { spinning = false; return tap(d.target); }
    const v = now - d.t > 90 ? 0 : Math.max(-2.2, Math.min(2.2, d.vel));
    if (Math.abs(v) > 0.05) coast(v); else snapTo(segs[pick()]);
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);

  function tap(target) {
    if (target.closest('#centerG')) { if (focus !== ROOT) zoomTo(focus.parent, 'out'); else spin(); return; }
    const g = target.closest('.seg');
    if (!g) return;
    const s = segs[+g.dataset.i];
    if (s.node.children) zoomTo(s.node, 'in');
    else snapTo(s, () => openLog(s.node));
  }

  function spin() { if (breathing) endBreath(true); coast((Math.random() < .5 ? -1 : 1) * (0.9 + Math.random() * 0.8)); }

  svg.addEventListener('keydown', e => {
    if (breathing) endBreath(true);
    const outer = segs.filter(s => s.ring === maxRing);
    const cur = segs[current];
    const idx = outer.indexOf(cur);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      snapTo(outer[mod(idx + (e.key === 'ArrowRight' ? 1 : -1), outer.length)]);
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (cur && cur.node.children) zoomTo(cur.node, 'in'); else if (cur) openLog(cur.node);
    } else if ((e.key === 'Escape' || e.key === 'Backspace') && focus !== ROOT) zoomTo(focus.parent, 'out');
  });

  $('spinBtn').addEventListener('click', spin);
  $('logBtn').addEventListener('click', () => { if (breathing) endBreath(true); const s = segs[current]; if (s) openLog(s.node); });

  // ---------- Storage (this browser only) ----------
  const KEY = 'ifeel.entries.v1';
  let memory = [];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return memory; } };
  const store = list => { memory = list; try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
  const updateEntry = (t, patch) => { const list = load(); const x = list.find(e => e.t === t); if (x) { Object.assign(x, patch); store(list); } };

  // ---------- Sheets ----------
  const scrim = $('scrim');
  let openSheet = null, chosen = null, level = 3, zonesOn = new Set(), afterTimer = null;
  function show(sheet) { if (openSheet) openSheet.classList.remove('show'); openSheet = sheet; sheet.classList.add('show'); scrim.classList.add('show'); }
  function hide() { if (afterTimer) { cancelAnimationFrame(afterTimer); afterTimer = null; } if (openSheet) openSheet.classList.remove('show'); scrim.classList.remove('show'); openSheet = null; svg.focus({ preventScroll: true }); }
  scrim.addEventListener('click', hide);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openSheet) { e.stopPropagation(); hide(); } }, true);

  const levelsEl = $('levels');
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.textContent = i; b.setAttribute('aria-label', `Strength ${i} of 5`);
    b.addEventListener('click', () => { level = i; paintLevels(); });
    levelsEl.append(b);
  }
  const paintLevels = () => [...levelsEl.children].forEach((b, i) => b.setAttribute('aria-pressed', i + 1 === level));

  const ZONES = ['Head', 'Jaw and throat', 'Shoulders', 'Chest', 'Stomach', 'Arms and hands', 'Legs'];
  const zonesEl = $('zones');
  ZONES.forEach(z => {
    const b = document.createElement('button'); b.textContent = z; b.dataset.z = z;
    b.addEventListener('click', () => toggleZone(z)); zonesEl.append(b);
  });
  $('bodySvg').addEventListener('click', e => { const z = e.target.getAttribute('data-zone'); if (z) toggleZone(z); });
  function toggleZone(z) { zonesOn.has(z) ? zonesOn.delete(z) : zonesOn.add(z); paintZones(); }
  function paintZones() {
    [...zonesEl.children].forEach(b => b.setAttribute('aria-pressed', zonesOn.has(b.dataset.z)));
    document.querySelectorAll('#bodySvg [data-zone]').forEach(s => s.style.fill = zonesOn.has(s.getAttribute('data-zone')) ? chosen.color : '');
  }

  function openLog(node) {
    chosen = node; level = 3; zonesOn = new Set(); paintLevels(); paintZones();
    $('logWord').textContent = node.name;
    $('logDot').style.background = node.color;
    const p = pathOf(node);
    $('logPath').textContent = p.length > 1 ? p.join(' › ') : 'A family of feelings. You can also tap it to find a more exact word.';
    $('note').value = '';
    show($('logSheet'));
  }
  $('cancelLog').addEventListener('click', hide);
  $('saveLog').addEventListener('click', () => {
    const entry = { t: Date.now(), name: chosen.name, path: pathOf(chosen), color: chosen.color, core: coreOf(chosen).name, tone: chosen.tone, level, zones: [...zonesOn], note: $('note').value.trim() };
    const list = load(); list.unshift(entry); store(list);
    openAfter(entry);
  });

  // ---------- After saving: savor, or one small step ----------
  const ringSvg = () => `<svg viewBox="-60 -60 120 120"><circle r="50" fill="none" stroke="#E4E7EE" stroke-width="8"/><circle id="ring" r="50" fill="none" stroke="${chosen.color}" stroke-width="8" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/><circle id="orb" r="20" fill="${chosen.color}" opacity=".35"/></svg>`;

  function openAfter(entry) {
    const body = $('afterBody');
    if (entry.tone === 'pleasant' || entry.tone === 'mixed') {
      $('afterTitle').textContent = 'Savor this moment';
      $('afterSub').textContent = `Stay with feeling ${entry.name.toLowerCase()} for twenty seconds. Notice where it sits in your body, and let it fill a little more space.`;
      body.innerHTML = `<div class="stage">${ringSvg()}<div class="big" id="stageText">Ready when you are</div><button class="btn primary" id="goSavor">Begin</button></div>`;
      $('goSavor').addEventListener('click', e => {
        e.target.remove();
        runTimer(20000, (k, left) => {
          $('ring').setAttribute('stroke-dashoffset', (314.16 * (1 - k)).toFixed(1));
          $('orb').setAttribute('r', (20 + 22 * k).toFixed(1));
          $('stageText').textContent = `${Math.ceil(left / 1000)} seconds`;
        }, () => { $('stageText').textContent = 'Keep it with you.'; updateEntry(entry.t, { savored: true }); });
      });
    } else {
      $('afterTitle').textContent = 'Something small, if you like';
      $('afterSub').textContent = 'Naming it was the first step. Pick one, or just close this.';
      body.innerHTML = `<div class="options">
        <button class="opt" data-o="breath"><strong>One slow breath</strong><span>Ten seconds, in and out.</span></button>
        <button class="opt" data-o="tell"><strong>Tell someone</strong><span>A short message is enough.</span></button>
        <button class="opt" data-o="ok"><strong>One thing that's still OK</strong><span>However small.</span></button>
      </div>`;
      body.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => smallStep(b.dataset.o, entry)));
    }
    show($('afterSheet'));
  }

  function smallStep(kind, entry) {
    const body = $('afterBody');
    if (kind === 'breath') {
      body.innerHTML = `<div class="stage">${ringSvg()}<div class="big" id="stageText">Breathe in</div></div>`;
      runTimer(10000, k => {
        const inhale = k < .4, b = inhale ? easeInOut(k / .4) : 1 - easeInOut((k - .4) / .6);
        $('orb').setAttribute('r', (16 + 30 * b).toFixed(1));
        $('ring').setAttribute('stroke-dashoffset', (314.16 * (1 - k)).toFixed(1));
        $('stageText').textContent = inhale ? 'Breathe in' : 'Breathe out';
      }, () => { $('stageText').textContent = 'Good.'; });
    } else if (kind === 'tell') {
      const msg = `Having a ${entry.name.toLowerCase()} kind of day. Could we talk later?`;
      body.innerHTML = `<p class="sub">Who would you like to know? Something like:</p><div class="msg" id="msgText"></div><div class="row"><button class="btn ghost" id="copyMsg">Copy message</button></div>`;
      $('msgText').textContent = msg;
      $('copyMsg').addEventListener('click', async e => {
        try { await navigator.clipboard.writeText(msg); e.target.textContent = 'Copied'; } catch (err) { e.target.textContent = 'Select the text to copy it'; }
      });
    } else {
      body.innerHTML = `<p class="sub">Right now, even with this, something is still OK. What is it?</p><input type="text" id="okText" placeholder="The coffee was good"><div class="row"><button class="btn primary" id="okSave">Keep it</button></div>`;
      $('okSave').addEventListener('click', () => { const v = $('okText').value.trim(); if (v) updateEntry(entry.t, { ok: v }); hide(); toast('Kept. Thanks for checking in.'); backToRoot(); });
      $('okText').focus();
    }
  }

  function runTimer(ms, step, done) {
    const t0 = performance.now();
    const f = now => {
      const k = Math.min(1, (now - t0) / ms);
      step(k, ms - (now - t0));
      if (k < 1) afterTimer = requestAnimationFrame(f); else { afterTimer = null; done(); }
    };
    afterTimer = requestAnimationFrame(f);
  }

  const backToRoot = () => { if (focus !== ROOT) setTimeout(() => zoomTo(ROOT, 'out'), 350); };
  $('afterDone').addEventListener('click', () => { hide(); toast('Noted. Thanks for checking in.'); backToRoot(); });

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- Journal ----------
  $('journalBtn').addEventListener('click', () => { if (breathing) endBreath(true); renderJournal(); show($('journalSheet')); });
  $('closeJournal').addEventListener('click', hide);

  function renderJournal() {
    const list = load();
    const strip = $('strip'); strip.textContent = '';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (let k = 13; k >= 0; k--) {
      const d0 = new Date(today); d0.setDate(today.getDate() - k);
      const d1 = new Date(d0); d1.setDate(d0.getDate() + 1);
      const col = document.createElement('div'); col.className = 'day';
      const lbl = document.createElement('span'); lbl.className = 'lbl';
      lbl.textContent = d0.toLocaleDateString(undefined, { weekday: 'narrow' });
      col.append(lbl);
      list.filter(x => x.t >= d0 && x.t < d1).slice(0, 4).forEach(x => {
        const dot = document.createElement('span'); dot.className = 'd'; dot.style.background = x.color; dot.title = x.name; col.append(dot);
      });
      strip.append(col);
    }
    const ul = $('entries'); ul.textContent = '';
    if (!list.length) { const li = document.createElement('li'); li.className = 'empty'; li.style.display = 'block'; li.textContent = 'Nothing yet. Spin the wheel and save a feeling to start.'; ul.append(li); return; }
    for (const x of list.slice(0, 60)) {
      const li = document.createElement('li');
      const dot = document.createElement('span'); dot.className = 'd'; dot.style.background = x.color;
      const mid = document.createElement('div');
      const w = document.createElement('div'); w.className = 'w'; w.textContent = x.name + (x.savored ? ' · savored' : '');
      const p = document.createElement('div'); p.className = 'p';
      p.textContent = [x.path.join(' › '), `strength ${x.level}/5`, (x.zones || []).join(', ')].filter(Boolean).join(' · ');
      mid.append(w, p);
      if (x.note) { const n = document.createElement('div'); n.className = 'n'; n.textContent = x.note; mid.append(n); }
      if (x.ok) { const n = document.createElement('div'); n.className = 'n'; n.textContent = `Still OK: ${x.ok}`; mid.append(n); }
      const t = document.createElement('div'); t.className = 't';
      t.textContent = new Date(x.t).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
      li.append(dot, mid, t); ul.append(li);
    }
  }

  // ---------- Start: land on Peaceful › Calm, then three breaths ----------
  build();
  const calm = segs.find(s => s.node.name === 'Calm');
  rot = -calm.mid; draw();
  startBreath();
}
</script>
</body>
</html>
